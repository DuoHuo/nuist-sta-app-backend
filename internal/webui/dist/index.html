<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>校园地图管理台</title>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" aria-label="主导航">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>
      <div class="brand-text"><strong>地图管理台</strong><span>nuist-sta-app</span></div>
    </div>
    <nav class="nav" id="nav">
      <a href="#/overview" data-view="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>数据概览</a>
      <a href="#/map" data-view="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>地图总览</a>
      <a href="#/buildings" data-view="buildings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="1"/><line x1="9" y1="7" x2="10" y2="7"/><line x1="14" y1="7" x2="15" y2="7"/><line x1="9" y1="12" x2="10" y2="12"/><line x1="14" y1="12" x2="15" y2="12"/><path d="M10 22v-4a2 2 0 0 1 4 0v4"/></svg>建筑管理</a>
      <a href="#/pois" data-view="pois"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>地点管理</a>
      <a href="#/fingerprints" data-view="fingerprints"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>指纹记录</a>
    </nav>
    <div class="sidebar-foot">
      <button id="btn-token" class="btn btn-ghost btn-sm" type="button" aria-label="设置管理令牌">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span id="token-state">令牌未设置</span>
      </button>
      <p class="foot-note">底图数据 © OpenStreetMap contributors</p>
    </div>
  </aside>

  <main class="content" id="view" tabindex="-1" aria-live="polite"></main>
</div>

<div id="toast-region" class="toast-region" aria-live="polite"></div>

<dialog id="dlg" class="dlg" aria-labelledby="dlg-title">
  <form id="dlg-form" method="dialog" novalidate>
    <header class="dlg-head">
      <h2 id="dlg-title">编辑</h2>
      <button class="icon-btn" type="button" id="dlg-close" aria-label="关闭弹窗">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </header>
    <div id="dlg-body" class="dlg-body"></div>
    <footer class="dlg-foot">
      <span id="dlg-error" class="dlg-error" role="alert"></span>
      <button class="btn" type="button" data-cancel>取消</button>
      <button class="btn btn-primary" type="submit" id="dlg-save">保存</button>
    </footer>
  </form>
</dialog>

<script src="vendor/maplibre-gl.js"></script>
<script src="admin-models.js"></script>
<script src="app.js"></script>
</body>
</html>
